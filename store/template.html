<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="x-dns-prefetch-control" content="on">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-name" content="飲食店メモ">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="飲食店メモ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#333336">
    <link rel="dns-prefetch preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="apple-touch-icon" type="image/x-icon" href="images/apple-touch-icon-152x152.png" sizes="152x152">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>飲食店メモ</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.8/cdn.min.js" integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style type="text/css">
      [x-cloak] {
        display: none !important;
      }
      body {
        color: #bcbcbc;
        background: #333336;
        font-size: 9pt;
      }
      a {
        color: #aaccee;
      }
      h1 {
        color: #eee;
        font-size: 11pt;
        margin: 16px 0 12px 6px;
      }
      p {
        color: #bcbcbc;
        margin-left: 6px
      }
      p > .updated-at {
        padding-left: 2em;
        color: #999;
      }
      h2 {
        font-size: 11pt;
      }
      table {
        border: 0 !important;
      }
      td {
        padding: 7px !important;
        color: #ccc;
        border-color: #535359 !important;
      }
      .nav-tabs li a {
        padding: 6px 10px;
      }
      i {
        margin: auto 4px;
      }
      i.star {
        color: #dd7766;
      }
      i.fa-thumbs-down {
        color: #666666;
      }
      i.fa-check {
        color: #99dc99;
      }
      i.map-icon {
        color: #cc7766;
      }
      .unvisited {
        color: gray;
      }
      .closed {
        text-decoration: line-through;
      }

      @media screen and (max-width: 960px) {
        body, .container {
          padding: 2px;
        }
        h1 {
          margin: 6px 4px;
        }
        .notice {
          display: none;
        }
        th, td {
          padding: 3px 2px !important;
        }
        td > i {
          margin: 0 2px;
        }
        td > i.map-icon {
          display: none;
        }
      }
    </style>

    <script type="text/javascript">
      document.addEventListener("alpine:init", () => {
        Alpine.data("storeApp", () => ({
          list: __LIST__,
          selected: null,
          DEFAULT_REGION: "ogikubo",

          init() {
            const has = (id) => this.list.some((r) => r.id === id);
            let saved = null;
            try {
              saved = localStorage.getItem("storeRegion");
            } catch (e) {
              saved = null;
            }

            this.selected = has(saved)
              ? saved
              : has(this.DEFAULT_REGION)
                ? this.DEFAULT_REGION
                : this.list.length
                  ? this.list[0].id
                  : null;
          },

          select(id) {
            this.selected = id;
            try {
              localStorage.setItem("storeRegion", id);
            } catch (e) {
              // 保存不可の環境でも表示は継続する
            }
          },

          move(delta) {
            if (!this.list.length) {
              return;
            }
            let idx = this.list.findIndex((r) => r.id === this.selected);
            if (idx === -1) {
              idx = 0;
            }
            const next = (idx + delta + this.list.length) % this.list.length;
            this.select(this.list[next].id);
          },

          onKey(e) {
            if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) {
              return;
            }
            const el = e.target;
            if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) {
              return;
            }
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              this.move(-1);
            } else if (e.key === "ArrowRight") {
              e.preventDefault();
              this.move(1);
            }
          },

          statusIcon(d) {
            if (d.star) {
              return { cls: "star fa-solid fa-star", title: null };
            }
            if (d.unvisited) {
              return { cls: "unvisited fa-solid fa-question", title: null };
            }
            if (d.nogood) {
              return { cls: "unvisited fa-solid fa-thumbs-down", title: "イマイチ" };
            }
            return { cls: "fa-solid fa-check", title: null };
          },

          genreEmojis(genre) {
            if (!genre) {
              return "";
            }

            const emojis = [];

            if (/(パン|ブレッド|ベーカリー)([\s\/]?|$)/.test(genre)) emojis.push("🍞");
            if (/(ピザ|ピッツァ|ピッツェリア)([\s\/]?|$)/.test(genre)) emojis.push("🍕");
            if (/(パスタ)([\s\/]?|$)/.test(genre)) emojis.push("🍝");
            if (/(イタリアン)([\s\/]?|$)/.test(genre)) emojis.push("🇮🇹");

            if (/((インド|印)カ(レ|リ)ー)([\s\/]?|$)/.test(genre)) {
              emojis.push("🇮🇳🍛");
            } else if (/(カ(レ|リ)ー)([\s\/]?|$)/.test(genre)) {
              emojis.push("🍛");
            }

            if (/(ラーメン|うどん|そば|蕎麦)([\s\/]?|$)/.test(genre)) emojis.push("🍜");
            if (/(寿司)([\s\/]?|$)/.test(genre)) emojis.push("🍣");
            if (/(天ぷら|天麩羅|天丼)([\s\/]?|$)/.test(genre)) emojis.push("🍤");
            if (/(和食|割烹|小料理)([\s\/]?|$)/.test(genre)) emojis.push("🇯🇵");
            if (/(フレンチ|フランス)([\s\/]?|$)/.test(genre)) emojis.push("🇫🇷");
            if (/(スペイン|スパニッシュ)([\s\/]?|$)/.test(genre)) emojis.push("🥘");
            if (/(中華)([\s\/]?|$)/.test(genre)) emojis.push("🥟");
            if (/(洋食|北欧|ロシア|地中海|西洋|欧州|ファミレス)([\s\/]?|$)/.test(genre)) emojis.push("🍽");
            if (/(ベトナム|タイ|エスニック|アジア|オセアニア|多国籍|メキシコ|台湾)([\s\/]?|$)/.test(genre)) emojis.push("🥙");
            if (/((たこ|お好み)焼き)([\s\/]?|$)/.test(genre)) emojis.push("🌮");
            if (/(サンドイッチ)([\s\/]?|$)/.test(genre)) emojis.push("🥖");
            if (/(バーガー)([\s\/]?|$)/.test(genre)) emojis.push("🍔");
            if (/(粥)([\s\/]?|$)/.test(genre)) emojis.push("🍚");
            if (/(魚介?|海鮮|うなぎ)([\s\/]?|$)/.test(genre)) emojis.push("🐟");
            if (/(野菜)([\s\/]?|$)/.test(genre)) emojis.push("🥗");
            if (/(定食|弁当)([\s\/]?|$)/.test(genre)) emojis.push("🍱");
            if (/(スイーツ|ケーキ|クレープ)([\s\/]?|$)/.test(genre)) emojis.push("🍰");
            if (/(カフェ)([\s\/]?|$)/.test(genre)) emojis.push("☕️");
            if (/(ジュース)([\s\/]?|$)/.test(genre)) emojis.push("🥤");
            if (/(アイス|氷)([\s\/]?|$)/.test(genre)) emojis.push("🍨");
            if (/(バー|バー?ル)([\s\/]?|$)/.test(genre)) emojis.push("🍸");
            if (/(居酒屋|飲み)([\s\/]?|$)/.test(genre)) emojis.push("🍶");
            if (/(ビストロ)([\s\/]?|$)/.test(genre)) emojis.push("🍽");

            return emojis.join(" ");
          },

          mapUrl(region, d) {
            const base = "https://www.google.co.jp/maps/search/";

            if (/^New/.test(region.name)) {
              return base + encodeURIComponent(d.name);
            }
            const query = [region.geo, d.name, d.genre].filter(Boolean).join(" ");
            return base + encodeURIComponent(query);
          },

          safeUrl(url) {
            return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
          },
        }));
      });
    </script>
  </head>
  <body>
    <div class="container">
      <H1>飲食店メモ</H1>

      <p class="description">
        <span class="notice">おもに夜の営業について。完全禁煙のみ</span>
        <span class="updated-at">__UPDATED_AT__ 更新</span>
      </p>

      <div id="app" x-data="storeApp" x-cloak @keydown.window="onKey($event)">
        <ul class="nav nav-tabs">
          <template x-for="region in list" :key="region.id">
            <li class="tab-title" :class="{ active: selected === region.id }" :id="'region-title-' + region.id">
              <a :href="'#region-' + region.id" class="region-tab" @click.prevent="select(region.id)" x-text="region.name"></a>
            </li>
          </template>
        </ul>

        <div class="tab-content">
          <template x-for="region in list" :key="region.id">
            <div class="tab-pane" :class="{ active: selected === region.id }" :id="'region-' + region.id">
              <table class="table table-responsive">
                <thead>
                  <tr>
                    <th>店名</th>
                    <th>&nbsp;</th>
                    <th>ジャンル</th>
                    <th>定休</th>
                    <th x-text="region.id === 'graveyard' ? '閉店' : 'L.O.'"></th>
                    <th>場所</th>
                    <th>メモ</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(d, i) in region.data" :key="i">
                    <tr>
                      <!-- separator -->
                      <td colspan="7" class="separator" x-show="d.type === 'separator'">
                        &nbsp;
                      </td>

                      <!-- 店名 -->
                      <td nowrap x-show="d.type !== 'separator'">
                        <i :class="statusIcon(d).cls" :title="statusIcon(d).title"></i>
                        <template x-if="d.tabelog">
                          <a :href="safeUrl(d.tabelog)" target="_blank" rel="noopener noreferrer" :title="d.nameAlter" :class="{ closed: d.closed }" x-text="d.name"></a>
                        </template>
                        <template x-if="!d.tabelog">
                          <span :class="{ closed: d.closed }" x-text="d.name"></span>
                        </template>
                      </td>

                      <!-- SNS / リンク -->
                      <td x-show="d.type !== 'separator'">
                        <template x-if="d.twitter">
                          <a :href="'https://twitter.com/' + d.twitter" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-twitter"></i>
                          </a>
                        </template>
                        <template x-if="d.facebook">
                          <a :href="'https://facebook.com/' + d.facebook" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-facebook"></i>
                          </a>
                        </template>
                        <template x-if="d.instagram">
                          <a :href="'https://instagram.com/' + d.instagram" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-instagram"></i>
                          </a>
                        </template>
                        <template x-if="d.home">
                          <a :href="safeUrl(d.home)" target="_blank" rel="noopener noreferrer">
                            <i class="fa-solid fa-house"></i>
                          </a>
                        </template>
                        <template x-for="(l, li) in (d.link || [])" :key="li">
                          <a :href="safeUrl(l)" target="_blank" rel="noopener noreferrer">
                            <i class="fa-solid fa-link"></i>
                          </a>
                        </template>
                      </td>

                      <!-- ジャンル -->
                      <td nowrap x-show="d.type !== 'separator'">
                        <span x-text="d.genre"></span>
                        <span x-text="genreEmojis(d.genre)"></span>
                      </td>

                      <td x-show="d.type !== 'separator'" x-text="d.closeDay"></td>
                      <td x-show="d.type !== 'separator'" x-text="region.id === 'graveyard' ? (d.closedAt || '') : d.lastOrder"></td>

                      <!-- 場所 -->
                      <td x-show="d.type !== 'separator'">
                        <i class="map-icon fa-solid fa-location-dot"></i>
                        <a :href="mapUrl(region, d)" target="_blank" rel="noopener noreferrer" x-text="d.location"></a>
                      </td>

                      <td x-show="d.type !== 'separator'" x-text="d.memo"></td>
                    </tr>
                  </template>

                  <tr>
                    <td colspan="6">&nbsp;</td>
                    <td x-text="'(全 ' + region.data.length + ' 件)'"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </div>
    </div>
  </body>
</html>
